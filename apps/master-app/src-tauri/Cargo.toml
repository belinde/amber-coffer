[package]
name = "amber-coffer-master"
version = "0.0.0"
description = "Amber Coffer — Master Screen (desktop GM app)"
authors = ["Amber Coffer Contributors"]
edition = "2021"
rust-version = "1.77"
default-run = "amber-coffer-master"

[lib]
name = "amber_coffer_master_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "import_poc"
path = "src/bin/import_poc.rs"

[[bin]]
name = "repair_poc_portraits"
path = "src/bin/repair_poc_portraits.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
urlencoding = "2"
keyring = { version = "3", features = ["sync-secret-service"] }
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
