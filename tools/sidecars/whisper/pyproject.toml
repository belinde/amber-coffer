[project]
name = "amber-whisper"
version = "0.0.0"
description = "Whisper STT sidecar for Amber Coffer (placeholder)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0"]
dev = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["amber_whisper*"]
